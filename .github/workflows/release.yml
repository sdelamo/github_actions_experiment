name: Release
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: LATEST_TAG
        run: |
          export LATEST_TAG=$(curl -L -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
      - name: Echo
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          DRAFT: ${{ github.event.release.draft }}
          DEFAULT_BRANCH: ${{ github.event.release.target_commitish == github.event.repository.default_branch }}
          TAG_NAME: ${{github.event.release.tag_name }}
          LATEST: ${{github.event.release.tag_name == env.LATEST_TAG }}
        run: |                
          echo "PRERELEASE=$PRERELEASE"
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH"
          echo "DRAFT=$DRAFT"
          echo "LATEST=$LATEST"
          echo "TAG_NAME=$TAG_NAME"
          echo "LATEST_TAG=$LATEST_TAG"
          echo "repository ${{ github.repository }}"
          latest_tag=$(curl -L -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          echo "latest_tag=$latest_tag"
#          if [[ "${latest_tag}" == "${{ github.event.release.tag_name }}" ]]; then
#            echo "This is the latest release."
